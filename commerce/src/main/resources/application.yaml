spring:
  application:
    name: commerce

  datasource:
    url: jdbc:h2:mem:commerce;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

# NOTE: show-sql 과 Hibernate 로그 레벨은 의도적으로 비워둔다.
#       5주차 TODO-1에서 수강생이 직접 켜는 실습이다.

springdoc:
  swagger-ui:
    path: /swagger-ui.html
